[workspace]
resolver = "2"
members = [
    "nexus-info",
    "nexus-version",
    "nexus-check",
    "nexus-hardware",
    "nexus-micro",
    "nexus-installer-backend",
    "nexus-theme",
    "nexus-build-helpers",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.30"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
nix = { version = "0.27", features = ["system", "process"] }
dirs = "5.0"
walkdir = "2.3"
sha2 = "0.10"
colored = "2.0"
indicatif = "0.17"
toml = "0.8"
config = "0.14"
async-trait = "0.1"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true