#
# Nexus offline installer sequence.
#
# Based on the CachyOS settings_offline.conf with two additions so the
# installer shows the same choices as the online variant:
#   - packagechooser@bootloader : pick GRUB / rEFInd / systemd-boot / Limine
#   - packagechooser@desktop    : pick the desktop environment (default KDE)
#   - netinstall                : feeds the selected desktop group into the
#                                 packages module
#
# NOTE: offline squashfs ships Plasma only; choosing another desktop works
# only when a network is available (packages_offline.conf has
# skip_if_no_internet: true).
---
modules-search: [ local ]

instances:
- id:       offline
  module:   packages
  config:   packages_offline.conf

- id:       before
  module:   shellprocess
  config:   shellprocess-before.conf

- id:       enable_ufw
  module:   shellprocess
  config:   shellprocess_enable_ufw.conf

- id:       bootloader
  module:   packagechooser
  config:   packagechooser_bootloader.conf

- id:       desktop
  module:   packagechooser
  config:   packagechooser_desktop.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@bootloader
  - partition
  - packagechooser@desktop
  - netinstall
  - users
  - summary
- exec:
  - partition
  - zfs
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - initcpio
  - zfshostid
  - removeuser
  - users
  - networkcfg
  - displaymanager
  - packages@offline
  - hwclock
  - bootloader
  - shellprocess@before
  - services-systemd
  - shellprocess
  - umount
- show:
  - finished

branding: nexus

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
