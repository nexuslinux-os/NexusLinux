name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Update packages
        run: pacman --noconfirm -Syu
      - name: Install shellcheck
        run: pacman --noconfirm -S shellcheck
      - name: Run ShellCheck
        run: |
          set -e
          mapfile -t SCRIPTS < <(git ls-files -- '*.sh' '*.bash')
          if [ ${#SCRIPTS[@]} -eq 0 ]; then
            echo "No shell scripts tracked"; exit 0
          fi
          shellcheck --shell=bash --severity=warning "${SCRIPTS[@]}"

  verify-sources:
    name: Verify package sources
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Update packages + non-root builder
        run: |
          set -e
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --recv-keys E8B9AA39F054E30E8290D492C3C4820857F654FE
          pacman-key --recv-keys 882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman-key --lsign-key E8B9AA39F054E30E8290D492C3C4820857F654FE
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47
          printf '[cachyos]\nSigLevel = Required DatabaseOptional\nServer = https://mirror.cachyos.org/repo/x86_64/cachyos\n' > /etc/pacman.d/cachyos.conf
          printf 'Include = /etc/pacman.d/cachyos.conf\n' >> /etc/pacman.conf
          pacman --noconfirm -Syyu
          pacman --noconfirm -S git --needed
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE" 2>/dev/null || true
      - name: makepkg --verifysource
        run: |
          set -e
          # Upstream PGP keys needed to verify signed sources (matches
          # build-nexus-repo.sh _UPSTREAM_KEYS). makepkg verifies with the
          # invoking user's home keyring, so import into builder's.
          echo "Server = https://keyserver.ubuntu.com" > /tmp/keyserver.conf
          runuser -u builder -- gpg --batch --no-tty --homedir /home/builder/.gnupg --keyserver-options config-file=/tmp/keyserver.conf --recv-keys \
            E8B9AA39F054E30E8290D492C3C4820857F654FE \
            B1B70BB1CD56047DEF31DE2EB62C3D10C54D5DA9 \
            E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 || \
            runuser -u builder -- gpg --batch --no-tty --homedir /home/builder/.gnupg --recv-keys \
            E8B9AA39F054E30E8290D492C3C4820857F654FE \
            B1B70BB1CD56047DEF31DE2EB62C3D10C54D5DA9 \
            E18447AC260021D31F3FF6C4C8A2A4774B8B63C4
          for pkg in localpkgs/*/; do
            [ -f "$pkg/PKGBUILD" ] || continue
            name="$(basename "$pkg")"
            echo "==> verifysource: $name"
            chown -R builder:builder "$pkg" 2>/dev/null || true
            ( cd "$pkg" && runuser -u builder -- timeout 1800 makepkg --verifysource --nodeps >/dev/null )
          done

  build-iso:
    name: Build ISO and publish
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --privileged
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Update packages + non-root builder
        run: |
          set -e
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --recv-keys E8B9AA39F054E30E8290D492C3C4820857F654FE
          pacman-key --recv-keys 882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman-key --lsign-key E8B9AA39F054E30E8290D492C3C4820857F654FE
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47
          printf '[cachyos]\nSigLevel = Required DatabaseOptional\nServer = https://mirror.cachyos.org/repo/x86_64/cachyos\n' > /etc/pacman.d/cachyos.conf
          printf 'Include = /etc/pacman.d/cachyos.conf\n' >> /etc/pacman.conf
          pacman --noconfirm -Syyu
          pacman --noconfirm -S git --needed
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE" 2>/dev/null || true
      - name: Install build dependencies
        # Mirrors build-nexus-iso.sh step [2/6] (build/makedepends + archiso).
        run: |
          pacman --noconfirm -Syy
          pacman --noconfirm -S \
            git meson cargo clang lld llvm \
            glib2 gtk3 pciutils procps-ng libusb \
            boost boost-libs ckbcomp cryptsetup dmidecode gptfdisk hwinfo \
            kconfig kcoreaddons kcrash ki18n kparts kpmcore kservice kwidgetsaddons \
            libpwquality mkinitcpio-openswap networkmanager polkit-qt6 python \
            qt6-declarative qt6-svg rsync solid squashfs-tools upower yaml-cpp \
            qt6-imageformats python-toml \
            cmake doxygen extra-cmake-modules ninja \
            python-jsonschema python-pyaml python-unidecode qt6-tools \
            zram-generator ananicy-cpp cachyos-ananicy-rules inxi systemd iw wireless-regdb \
            bat expac eza fastfetch fish fish-autopair fish-pure-prompt fisher fzf \
            pkgfile tealdeer ttf-fantasque-nerd \
            archiso mkinitcpio-archiso gnupg \
            scx-manager grub
      - name: Restore Nexus signing key
        run: |
          mkdir -p localpkgs/nexus-keyring/gnupg/private-keys-v1.d localpkgs/nexus-keyring/gnupg/openpgp-revocs.d
          chmod 700 localpkgs/nexus-keyring/gnupg
          echo "${NEXUS_KEY_ASC}" | base64 --decode > localpkgs/nexus-keyring/gnupg/nexus-master-key.asc
          gpg --homedir localpkgs/nexus-keyring/gnupg --batch --import localpkgs/nexus-keyring/gnupg/nexus-master-key.asc
        env:
          NEXUS_KEY_ASC: "${{ secrets.NEXUS_KEY_ASC }}"
      - name: Build Nexus ISO
        run: ./build-nexus-iso.sh desktop
        env:
          NEXUS_KEY_PASSPHRASE: "${{ secrets.NEXUS_KEY_PASSPHRASE }}"
          NEXUS_GPGKEY: "${{ secrets.NEXUS_GPGKEY }}"
          BUILD_USER: builder
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-iso
          path: out/**/*.iso
          if-no-files-found: error
      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -e
          ISO_PATH="$(find out -maxdepth 2 -name '*.iso' -print -quit)"
          [ -n "$ISO_PATH" ] || { echo "no ISO built"; exit 1; }
          TAG="nexus-iso-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          NOTES="Nexus Linux ISO build (GitHub Actions run ${GITHUB_RUN_NUMBER})"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nexus Linux $TAG" \
            --notes "$NOTES" \
            "$ISO_PATH"
          echo "Released: $GITHUB_REPOSITORY/releases/tag/$TAG"
